name: CI
on:
  pull_request:
  push:
    branches: [main]

# Latest push wins for a given ref. The deploy job below keeps Void's
# Cloudflare group so two main deploys do not overlap.
concurrency:
  group: void-cloudflare-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Void types
        run: pnpm exec void prepare
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm test

  # Deploy steps follow `void init --github` for a Cloudflare + pnpm app.
  # Two additions: CLOUDFLARE_ACCOUNT_ID (needed when the token can see more
  # than one account) and a skip until void.lock.json exists.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    concurrency:
      group: void-cloudflare-deploy-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy
        env:
          # Add this scoped token at Settings → Secrets and variables → Actions.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Set when the token can access more than one account.
          # An empty value is ignored. Do not put the account id in the repo.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Required only for PostgreSQL/MySQL provisioning and migrations.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Required in fresh checkouts when a Worker Version has no preview URL.
          CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
          # Required only when Cloudflare Access protects Worker readiness.
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          if [ ! -f void.lock.json ]; then
            echo "Skipping deploy: void.lock.json is not in the repository yet."
            echo "Void applies the first deploy from one local machine, then the lock file is committed."
            echo "  pnpm exec void deploy --platform cloudflare"
            echo "After that file is on main, this job will deploy."
            exit 0
          fi
          pnpm exec void deploy --platform cloudflare
